name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      publish-plan-artifact-id:
        type: string
        required: true
    outputs:
      pack-dir-artifact-id:
        value: ${{ jobs.verify.outputs.pack-dir-artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Verify documentation and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_URL: https://docs.example.test/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs


  database:
    name: Verify database (${{ matrix.group }})
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [runtime, project]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Install Docker tools
        run: brew install colima docker
      - name: Start local Docker
        id: docker
        run: |
          colima start --runtime docker --vm-type vz --cpus 4 --memory 4
          docker info
          echo "PREVIEWHOST_TEST_DOCKER_SOCKET=$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      - name: Pull database images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: npm run test:build
      - name: Pilot image lookup timings (excluded from qualification)
        if: github.event_name == 'pull_request' && matrix.group == 'runtime'
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Docker, object } from './.local/test-build/docker.js';
          const docker = await Docker.connect(process.env.PREVIEWHOST_TEST_DOCKER_SOCKET);
          async function request(path) {
            const start = performance.now();
            const result = await docker.request('GET', path);
            assert.ok(result.status === 200, 'Image benchmark requires HTTP 200.');
            return { body: result.body, milliseconds: performance.now() - start };
          }
          async function lookup(tag, filtered) {
            const suffix = filtered ? `?filters=${encodeURIComponent(JSON.stringify({ reference: [tag] }))}` : '';
            const listed = await request(`/images/json${suffix}`);
            assert.ok(Array.isArray(listed.body), 'Image list must be an array.');
            const image = listed.body.map(object).find((item) => Array.isArray(item.RepoTags) && item.RepoTags.includes(tag));
            assert.ok(typeof image?.Id === 'string' && /^sha256:[a-f0-9]{64}$/.test(image.Id), 'Required local image must have a valid immutable ID.');
            const inspected = await request(`/images/${image.Id}/json`);
            assert.ok(object(inspected.body).Id === image.Id, 'Image identity must remain unchanged during inspection.');
            return { id: image.Id, listCount: listed.body.length, listMs: listed.milliseconds,
              inspectMs: inspected.milliseconds, totalMs: listed.milliseconds + inspected.milliseconds };
          }
          const { body: info } = await request('/info');
          console.log(JSON.stringify({ kind: 'environment', api: '1.40', node: process.version,
            platform: process.platform, architecture: process.arch, engine: info.ServerVersion,
            driver: info.Driver, cpus: info.NCPU, memoryBytes: info.MemTotal }));
          for (let repetition = 1; repetition <= 3; repetition++) {
            for (const [index, tag] of ['postgres:17-alpine', 'redis:7-alpine'].entries()) {
              const database = index === 0 ? 'postgres' : 'redis';
              const order = (repetition + index) % 2 ? [false, true] : [true, false];
              const pair = [];
              for (const filtered of order) {
                const { id, ...timings } = await lookup(tag, filtered);
                pair.push(id);
                console.log(JSON.stringify({ kind: 'sample', repetition, database,
                  variant: filtered ? 'filtered' : 'unfiltered', ...timings }));
              }
              assert.ok(pair[0] === pair[1], 'Filtered and unfiltered lookup must select the same immutable image.');
              console.log(JSON.stringify({ kind: 'pair', repetition, database, identityEquivalent: true }));
            }
          }
          console.log(JSON.stringify({ kind: 'complete', pairs: 6, lookups: 12, identityEquivalent: true }));
          NODE
      - run: node scripts/test-groups.mjs "${{ matrix.group }}"
      - name: Docker startup diagnostics
        if: failure() && steps.docker.outcome == 'failure'
        run: |
          for file in "$HOME"/.colima/_lima/colima/ha.stderr.log "$HOME"/.colima/_lima/colima/serial*.log; do
            if [ -f "$file" ]; then
              echo "::group::$(basename "$file")"
              cat "$file"
              echo "::endgroup::"
            fi
          done
      - name: Stop local Docker
        if: always()
        run: colima stop

  package:
    name: Verify native tests and package
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      pack-dir-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:build
      - run: node scripts/test-groups.mjs native
      - name: Pack pull request
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/previewhost-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/previewhost-package"
          npm run check:package -- "$RUNNER_TEMP"/previewhost-package/*.tgz
      - name: Download release plan
        if: inputs.publish-plan-artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.publish-plan-artifact-id }}
          path: ${{ runner.temp }}/previewhost-plan
          merge-multiple: true
      - name: Select release channel, pack, and verify
        if: inputs.publish-plan-artifact-id != ''
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const file = `${process.env.RUNNER_TEMP}/previewhost-plan/publish-plan.json`;
          const data = JSON.parse(readFileSync(file, 'utf8'));
          const releases = data.plan.flat();
          assert.equal(releases.length, 1);
          assert.match(version, /^\d+\.\d+\.\d+(?:-alpha\.\d+)?$/);
          assert.deepEqual([releases[0].kind, releases[0].name, releases[0].version], ['publish', name, version], 'Release plan must match the package.');
          // npm can retain latest on the first alpha; select our channel explicitly.
          releases[0].tag = version.includes('-') ? 'alpha' : 'latest';
          writeFileSync(file, JSON.stringify(data));
          NODE
          npm run changeset -- pack --from-publish-plan "$RUNNER_TEMP/previewhost-plan/publish-plan.json" --out-dir "$RUNNER_TEMP/previewhost-release"
          npm run check:package -- "$RUNNER_TEMP"/previewhost-release/packages/*.tgz
      - name: Upload verified release
        if: inputs.publish-plan-artifact-id != ''
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: previewhost-release
          path: ${{ runner.temp }}/previewhost-release
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify macOS package
    needs: [docs, database, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pack-dir-artifact-id: ${{ needs.package.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require every verification job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RELEASE_PLAN: ${{ inputs.publish-plan-artifact-id }}
        run: |
          node --input-type=module <<'NODE'
          import { checkRequiredJobs } from './scripts/verify-release.mjs';
          checkRequiredJobs(JSON.parse(process.env.JOB_RESULTS), Boolean(process.env.RELEASE_PLAN));
          NODE
