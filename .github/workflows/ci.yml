name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      publish-plan-artifact-id:
        type: string
        required: true
    outputs:
      pack-dir-artifact-id:
        value: ${{ jobs.verify.outputs.pack-dir-artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platforms:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - name: Linux dependencies and databases
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y procps lsof
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
          echo 'PREVIEWHOST_TEST_DOCKER_SOCKET=/var/run/docker.sock' >> "$GITHUB_ENV"
      - name: Linux regression suite
        if: runner.os == 'Linux'
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/*.test.js
      - name: Windows kernel ownership, native commands, ACLs, and named-pipe transport
        if: runner.os == 'Windows'
        # Linux-container database tests require a separate Windows Docker Desktop host.
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/platform.test.js .local/test-build/native.test.js .local/test-build/docker.test.js .local/test-build/keystore.test.js
      - name: Installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platform-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/platform-package"
          npm run check:package -- "$RUNNER_TEMP"/platform-package/*.tgz

  docs:
    name: Verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCS_URL: https://docs.example.test/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs

  verify:
    name: Verify macOS package
    # Colima uses this Intel runner in its own macOS integration suite.
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      pack-dir-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Install Docker tools
        run: brew install colima docker
      - name: Start local Docker
        id: docker
        run: |
          colima start --runtime docker --vm-type vz --cpus 2 --memory 4
          docker info
          echo "PREVIEWHOST_TEST_DOCKER_SOCKET=$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      - name: Pull database images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: npm run verify:release
      - name: Pack pull request
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/previewhost-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/previewhost-package"
          npm run check:package -- "$RUNNER_TEMP"/previewhost-package/*.tgz
      - name: Download release plan
        if: inputs.publish-plan-artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.publish-plan-artifact-id }}
          path: ${{ runner.temp }}/previewhost-plan
          merge-multiple: true
      - name: Select release channel, pack, and verify
        if: inputs.publish-plan-artifact-id != ''
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const file = `${process.env.RUNNER_TEMP}/previewhost-plan/publish-plan.json`;
          const data = JSON.parse(readFileSync(file, 'utf8'));
          const releases = data.plan.flat();
          assert.equal(releases.length, 1);
          assert.match(version, /^\d+\.\d+\.\d+(?:-alpha\.\d+)?$/);
          assert.deepEqual([releases[0].kind, releases[0].name, releases[0].version], ['publish', name, version], 'Release plan must match the package.');
          // npm can retain latest on the first alpha; select our channel explicitly.
          releases[0].tag = version.includes('-') ? 'alpha' : 'latest';
          writeFileSync(file, JSON.stringify(data));
          NODE
          npm run changeset -- pack --from-publish-plan "$RUNNER_TEMP/previewhost-plan/publish-plan.json" --out-dir "$RUNNER_TEMP/previewhost-release"
          npm run check:package -- "$RUNNER_TEMP"/previewhost-release/packages/*.tgz
      - name: Upload verified release
        if: inputs.publish-plan-artifact-id != ''
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: previewhost-release
          path: ${{ runner.temp }}/previewhost-release
          if-no-files-found: error
          retention-days: 30
      - name: Require verified release artifact
        if: github.event_name != 'pull_request' || inputs.publish-plan-artifact-id != ''
        env:
          PACK_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.match(process.env.PACK_ARTIFACT_ID ?? '', /^[1-9][0-9]*$/, 'Release requires the verified package artifact.');
          NODE
      - name: Docker startup diagnostics
        if: failure() && steps.docker.outcome == 'failure'
        run: |
          for file in "$HOME"/.colima/_lima/colima/ha.stderr.log "$HOME"/.colima/_lima/colima/serial*.log; do
            if [ -f "$file" ]; then
              echo "::group::$(basename "$file")"
              cat "$file"
              echo "::endgroup::"
            fi
          done
      - name: Stop local Docker
        if: always()
        run: colima stop
