name: Targeted platform diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  platform:
    name: Platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f07e375b9ce886b3eb1f2efaaff32c563037232b
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Trace shutdown file inspection failures
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          let s = readFileSync('src/windows.ts', 'utf8');
          s = s.replace('  if (attributes === 0xffffffff || (attributes & 0x400))', "  if (attributes === 0xffffffff) console.error('WINDOWS_ATTRIBUTES_FAILURE', win().error());\n  if (attributes === 0xffffffff || (attributes & 0x400))");
          s = s.replace('  if (result !== 0) throw new PreviewError', "  if (result !== 0) console.error('WINDOWS_SECURITY_FAILURE', result);\n  if (result !== 0) throw new PreviewError");
          writeFileSync('src/windows.ts', s);
          s = readFileSync('src/project.ts', 'utf8');
          s = s.replace("    throw new PreviewError('UNAUTHORIZED', 'The project connection file or its directory is unsafe or invalid.');", "    console.error('RECORD_READ_FAILURE', error);\n    throw new PreviewError('UNAUTHORIZED', 'The project connection file or its directory is unsafe or invalid.');");
          writeFileSync('src/project.ts', s);
          JS
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - name: Windows shutdown diagnosis
        if: runner.os == 'Windows'
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/project.integration.test.js .local/test-build/mcp-access.integration.test.js
      - name: Verify installed package
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platform-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/platform-package"
          npm run check:package -- "$RUNNER_TEMP"/platform-package/*.tgz
