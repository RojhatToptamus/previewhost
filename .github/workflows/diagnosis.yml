name: Targeted platform diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  platform:
    name: Platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 045512abb46755fe370400c178e21e9f1e580759
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: node -p "process.platform + ' ' + process.arch"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - name: Connected pipe authentication and private-storage regressions
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/docker.test.js .local/test-build/platform.test.js
      - name: Installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platform-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/platform-package"
          npm run check:package -- "$RUNNER_TEMP"/platform-package/*.tgz
