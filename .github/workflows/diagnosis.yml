name: Targeted platform diagnosis
on:
  push:
    branches: [codex/ci-diagnosis]
permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./scripts/windows-databases.ps1
      - if: matrix.os == 'windows-11-arm'
        run: npm run build
      - if: matrix.os == 'windows-11-arm'
        run: npx tsc -p tsconfig.test.json
      - if: matrix.os == 'windows-11-arm'
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/gateway.test.js .local/test-build/cli.integration.test.js .local/test-build/project-lifecycle.test.js .local/test-build/secret-input.integration.test.js .local/test-build/docker.test.js .local/test-build/mcp-access.integration.test.js .local/test-build/project.integration.test.js
