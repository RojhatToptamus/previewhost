name: Targeted platform diagnosis
on:
  push:
    branches: [codex/ci-diagnosis]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - shell: pwsh
        run: ./scripts/windows-databases.ps1
