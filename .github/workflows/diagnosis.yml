name: Targeted CI diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  control:
    name: Native Linux Docker API control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEWHOST_TEST_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Pull matching database images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - name: Record control environment
        run: |
          docker info --format 'engine={{.ServerVersion}} driver={{.Driver}} images={{.Images}} cpus={{.NCPU}} memory={{.MemTotal}}'
          uname -r
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource
      - run: npm run test:build
      - name: Measure existing read-only Docker calls
        run: node scripts/diagnose-docker-control.mjs
      - name: Check cancellation regression
        run: |
          node --test --test-reporter=tap --test-name-pattern='^aborting outcome stops test continuation' .local/test-build/jobs.integration.test.js | tee "$RUNNER_TEMP/cancellation.tap"
          grep -Fx '# tests 1' "$RUNNER_TEMP/cancellation.tap"
          grep -Fx '# pass 1' "$RUNNER_TEMP/cancellation.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/cancellation.tap
