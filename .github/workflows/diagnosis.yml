name: Targeted platform diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  backend:
    name: Linux backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure WSL2 and run a Linux container
        shell: pwsh
        run: ./scripts/windows-backend-probe.ps1
      - uses: actions/checkout@v7
        with:
          ref: 5d8c4208fb2251aa6f74af65906d4001f40d511f
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Native Windows database lifecycle qualification
        shell: pwsh
        run: ./scripts/windows-database-probe.ps1
      - name: Preserve setup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: ${{ runner.temp }}/previewhost-backend/*.log
          if-no-files-found: error
