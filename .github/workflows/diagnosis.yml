name: Targeted CI diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  database:
    name: Trace database operations (${{ matrix.cpus }} CPU)
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpus: [1, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: brew install colima docker
      - name: Start fresh Docker engine
        id: docker
        run: |
          colima start --runtime docker --vm-type vz --cpus "${{ matrix.cpus }}" --memory 4
          docker info
          echo "PREVIEWHOST_TEST_DOCKER_SOCKET=$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      - name: Pull database images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: npm run test:build
      - name: Run complete selected scenarios once
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/operation-traces"
          colima ssh -- sh -c 'uname -r; getconf _NPROCESSORS_ONLN; cat /sys/devices/system/clocksource/clocksource0/current_clocksource; cat /proc/interrupts' > "$RUNNER_TEMP/operation-traces/guest-before.txt"
          colima ssh -- vmstat -t 1 > "$RUNNER_TEMP/operation-traces/vmstat.txt" &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true; wait "$observer" 2>/dev/null || true' EXIT
          export PREVIEWHOST_DIAG_DIR="$RUNNER_TEMP/operation-traces"
          export NODE_OPTIONS="--import=$PWD/scripts/diagnose-operations.mjs"
          node --test --test-reporter=tap --test-concurrency=1 \
            --test-name-pattern='^(dashboard reset enforces authorization|failed and canceled seeds retain|offline projects keep real PostgreSQL)' \
            .local/test-build/data-reset.integration.test.js \
            .local/test-build/jobs-database.integration.test.js \
            .local/test-build/project-lifecycle.test.js
      - name: Capture final guest counters
        if: always() && steps.docker.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/operation-traces"
          colima ssh -- cat /proc/interrupts > "$RUNNER_TEMP/operation-traces/guest-after.txt"
      - name: Retain operation traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operation-traces-${{ matrix.cpus }}cpu
          path: ${{ runner.temp }}/operation-traces
          if-no-files-found: warn
          retention-days: 7
      - name: Stop Docker
        if: always()
        run: colima stop
