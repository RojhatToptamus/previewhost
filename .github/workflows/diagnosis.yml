name: Targeted platform diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  platform:
    name: Platform check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 82d4e12c8d2c92cc6fabef5e7d5ae8961e52dbcf
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Inspect Windows default owner relationships
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $path = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $path | Out-Null
          try {
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($identity.User)
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new($identity.User, 'FullControl', 'ObjectInherit,ContainerInherit', 'None', 'Allow'))
            Set-Acl -LiteralPath $path -AclObject $acl
            $env:PREVIEWHOST_OWNER_PROBE = Join-Path $path 'empty'
            node -e "require('fs').writeFileSync(process.env.PREVIEWHOST_OWNER_PROBE, '')"
            if ($LASTEXITCODE -ne 0) { throw 'Node file creation failed.' }
            $directoryOwner = (Get-Acl -LiteralPath $path).GetOwner([System.Security.Principal.SecurityIdentifier])
            $childOwner = (Get-Acl -LiteralPath $env:PREVIEWHOST_OWNER_PROBE).GetOwner([System.Security.Principal.SecurityIdentifier])
            [ordered]@{
              tokenOwnerMatchesUser = $identity.Owner.Value -eq $identity.User.Value
              tokenOwnerIsAdministrators = $identity.Owner.Value -eq 'S-1-5-32-544'
              directoryOwnerMatchesUser = $directoryOwner.Value -eq $identity.User.Value
              childOwnerMatchesUser = $childOwner.Value -eq $identity.User.Value
              childOwnerMatchesTokenOwner = $childOwner.Value -eq $identity.Owner.Value
            } | ConvertTo-Json -Compress
          } finally { Remove-Item -LiteralPath $path -Recurse -Force }
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - name: Linux dependencies and images
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y procps lsof
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
          echo 'PREVIEWHOST_TEST_DOCKER_SOCKET=/var/run/docker.sock' >> "$GITHUB_ENV"
      - name: Linux complete source suite
        if: runner.os == 'Linux'
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/*.test.js
      - name: Windows ownership, processes, transport, and password storage
        if: runner.os == 'Windows'
        run: node --test --test-reporter=tap --test-concurrency=1 .local/test-build/platform.test.js .local/test-build/native.test.js .local/test-build/docker.test.js .local/test-build/keystore.test.js
      - name: Verify installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/platform-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/platform-package"
          npm run check:package -- "$RUNNER_TEMP"/platform-package/*.tgz
