name: Targeted platform diagnosis
on:
  push:
    branches: [codex/ci-diagnosis]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: brew install colima docker
      - run: |
          colima start --runtime docker --vm-type vz --cpus 2 --memory 4
          docker info
          echo "PREVIEWHOST_TEST_DOCKER_SOCKET=$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: |
          colima ssh -- cat /proc/loadavg /proc/meminfo /proc/pressure/cpu /proc/pressure/io
          colima ssh -- top -b -n 1
      - run: npm run build && npx tsc -p tsconfig.test.json
      - run: |
          export PREVIEWHOST_DIAG_FILE="$RUNNER_TEMP/docker-operations.jsonl"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const observer = pathToFileURL(resolve('scripts/diagnostic-docker.mjs')).href;
          for (const directory of ['dist', '.local/test-build']) {
            appendFileSync(`${directory}/docker.js`, `\nimport { observe } from ${JSON.stringify(observer)}; observe(Docker);\n`);
            appendFileSync(`${directory}/runtime.js`, `\nimport { trace } from ${JSON.stringify(observer)}; for(const method of ['runCandidate','stop','deleteData','cancel','close']) Runtime.prototype[method]=trace('runtime.'+method,Runtime.prototype[method]);\n`);
            appendFileSync(`${directory}/native.js`, `\nimport { trace } from ${JSON.stringify(observer)}; launchNative=trace('native.launch',launchNative);runNativeJob=trace('native.job',runNativeJob);\n`);
          }
          NODE
          node --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^(real PostgreSQL jobs:|failed and canceled seeds|dashboard reset enforces|offline projects keep real PostgreSQL|one shared MCP connection routes)' .local/test-build/jobs.integration.test.js .local/test-build/project-lifecycle.test.js .local/test-build/project.integration.test.js
      - if: always()
        run: |
          cat "$RUNNER_TEMP/docker-operations.jsonl" || true
          colima ssh -- cat /proc/loadavg /proc/meminfo /proc/pressure/cpu /proc/pressure/io
          colima ssh -- top -b -n 1
          colima stop
