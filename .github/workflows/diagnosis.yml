name: Targeted platform diagnosis

on:
  push:
    branches: [codex/ci-diagnosis]

permissions:
  contents: read

jobs:
  backend:
    name: Linux backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure WSL2 and run a Linux container
        shell: pwsh
        run: ./scripts/windows-backend-probe.ps1
      - name: Preserve setup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: ${{ runner.temp }}/previewhost-backend/*.log
          if-no-files-found: error
