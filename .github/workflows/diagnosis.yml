name: Targeted platform diagnosis
on:
  push:
    branches: [codex/ci-diagnosis]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: brew install colima docker
      - run: |
          colima start --runtime docker --vm-type vz --cpus 2 --memory 4
          docker info
          echo "PREVIEWHOST_TEST_DOCKER_SOCKET=$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
      - run: |
          time docker info >/dev/null
          time docker run --rm redis:7-alpine true
          colima ssh -- cat /proc/loadavg /proc/meminfo /proc/pressure/cpu /proc/pressure/io
          colima ssh -- top -b -n 1
      - run: npm run build && npx tsc -p tsconfig.test.json
      - run: |
          export PREVIEWHOST_DIAG_FILE="$RUNNER_TEMP/docker-operations.jsonl"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const observer = pathToFileURL(resolve('scripts/diagnostic-docker.mjs')).href;
          for (const file of ['dist/docker.js', '.local/test-build/docker.js']) appendFileSync(file, `\nimport { observe } from ${JSON.stringify(observer)}; observe(Docker);\n`);
          NODE
          node scripts/diagnostic-image.mjs
          node --test --test-reporter=tap --test-concurrency=1 --test-name-pattern='^(real owned PostgreSQL|real owner SIGKILL|offline projects keep real PostgreSQL|one shared MCP connection routes)' .local/test-build/data.integration.test.js .local/test-build/project-lifecycle.test.js .local/test-build/project.integration.test.js
      - if: always()
        run: |
          cat "$RUNNER_TEMP/docker-operations.jsonl" || true
          colima ssh -- cat /proc/loadavg /proc/meminfo /proc/pressure/cpu /proc/pressure/io
          colima ssh -- top -b -n 1
          colima stop
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json'));
          p.scripts.verify = 'npm run build && npx tsc -p tsconfig.test.json && node --test --test-reporter=tap --test-concurrency=1 .local/test-build/data.test.js .local/test-build/data.integration.test.js examples/multi-repo/worktrees.integration.test.mjs';
          writeFileSync('package.json', JSON.stringify(p));
          NODE
      - shell: pwsh
        run: ./scripts/windows-databases.ps1
